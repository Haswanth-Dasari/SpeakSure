<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeakSure – Module Self-Tests</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --pass: #22c55e;
      --fail: #ef4444;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .test-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .test-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .test-status {
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      margin-top: 0.25rem;
    }
    .pass {
      background: rgba(34, 197, 94, 0.15);
      color: var(--pass);
    }
    .fail {
      background: rgba(239, 68, 68, 0.15);
      color: var(--fail);
    }
    .details {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pure Function Self-Tests</h1>
    <p>Automated verification for browser WAV encoding, anti-aliased resampling, VAD segmentation, and the silent-answer window.</p>
    <div id="results" class="test-list" aria-live="polite">Running tests…</div>
  </main>

  <script type="module">
    import { encodeWav, resampleAudio } from "./js/wav.js";
    import { VadDetector, calculateRms, SILENCE_DURATION_SEC } from "./js/vad.js";

    const resultsContainer = document.getElementById("results");
    resultsContainer.textContent = "";

    function renderResult(name, passed, message) {
      const card = document.createElement("div");
      card.className = "test-card";

      const title = document.createElement("div");
      title.className = "test-title";
      title.textContent = name;
      card.appendChild(title);

      const status = document.createElement("span");
      status.className = "test-status " + (passed ? "pass" : "fail");
      status.textContent = passed ? "PASS" : "FAIL";
      card.appendChild(status);

      if (message) {
        const details = document.createElement("div");
        details.className = "details";
        details.textContent = message;
        card.appendChild(details);
      }

      resultsContainer.appendChild(card);
    }

    // Test 1: WAV encoder
    try {
      const sampleRate = 16000;
      const numSamples = 3200;
      const samples = new Float32Array(numSamples);
      for (let i = 0; i < numSamples; i++) {
        samples[i] = Math.sin((2 * Math.PI * 440 * i) / sampleRate) * 0.5;
      }

      const buffer = encodeWav(samples, sampleRate);
      if (buffer.byteLength !== 44 + numSamples * 2) {
        throw new Error(`Buffer size mismatch: expected ${44 + numSamples * 2}, got ${buffer.byteLength}`);
      }

      const view = new DataView(buffer);
      const dec = new TextDecoder("ascii");
      if (dec.decode(new Uint8Array(buffer, 0, 4)) !== "RIFF") throw new Error("Missing RIFF header");
      if (view.getUint32(4, true) !== 36 + numSamples * 2) throw new Error("Incorrect ChunkSize");
      if (dec.decode(new Uint8Array(buffer, 8, 4)) !== "WAVE") throw new Error("Missing WAVE tag");
      if (dec.decode(new Uint8Array(buffer, 12, 4)) !== "fmt ") throw new Error("Missing fmt chunk");
      if (view.getUint16(20, true) !== 1) throw new Error("AudioFormat must be 1 (PCM)");
      if (view.getUint16(22, true) !== 1) throw new Error("Channels must be 1 (mono)");
      if (view.getUint32(24, true) !== sampleRate) throw new Error("SampleRate mismatch");
      if (view.getUint16(34, true) !== 16) throw new Error("BitsPerSample must be 16");
      if (dec.decode(new Uint8Array(buffer, 36, 4)) !== "data") throw new Error("Missing data chunk");
      if (view.getUint32(40, true) !== numSamples * 2) throw new Error("Incorrect data size");

      renderResult("WAV Encoder (header fields and buffer length)", true, "All RIFF/WAVE header fields, PCM format tags, and byte lengths match specification.");
    } catch (err) {
      renderResult("WAV Encoder (header fields and buffer length)", false, String(err));
    }

    // Test 2: Resampler
    try {
      const sourceRate = 48000;
      const targetRate = 16000;
      const durationSec = 1.0;
      const frequency = 440;
      const amplitude = 0.8;

      const numSourceSamples = Math.round(sourceRate * durationSec);
      const sourceSamples = new Float32Array(numSourceSamples);
      for (let i = 0; i < numSourceSamples; i++) {
        sourceSamples[i] = amplitude * Math.sin((2 * Math.PI * frequency * i) / sourceRate);
      }

      const resampled = resampleAudio(sourceSamples, sourceRate, targetRate);
      const expectedRms = amplitude / Math.SQRT2;
      const actualRms = calculateRms(resampled);
      const ampDiffRatio = Math.abs(actualRms - expectedRms) / expectedRms;
      if (ampDiffRatio > 0.05) {
        throw new Error(`Amplitude difference ${ (ampDiffRatio * 100).toFixed(2) }% exceeds 5% tolerance`);
      }

      let zeroCrossings = 0;
      for (let i = 1; i < resampled.length; i++) {
        if (resampled[i - 1] <= 0 && resampled[i] > 0) zeroCrossings++;
      }
      const measuredFreq = zeroCrossings / durationSec;
      const freqDiffRatio = Math.abs(measuredFreq - frequency) / frequency;
      if (freqDiffRatio > 0.05) {
        throw new Error(`Frequency difference ${ (freqDiffRatio * 100).toFixed(2) }% exceeds 5% tolerance (measured ${measuredFreq} Hz)`);
      }

      renderResult("Resampler (440 Hz tone frequency and amplitude preservation)", true, `Resampled 48 kHz to 16 kHz: frequency error ${(freqDiffRatio * 100).toFixed(2)}%, amplitude error ${(ampDiffRatio * 100).toFixed(2)}% (both within 5%).`);
    } catch (err) {
      renderResult("Resampler (440 Hz tone frequency and amplitude preservation)", false, String(err));
    }

    // Test 3: VAD segmentation and stop timing
    try {
      const sampleRate = 16000;
      const frameSec = 0.05;
      const frameLen = Math.round(sampleRate * frameSec);
      const vad = new VadDetector(sampleRate);

      const silence = new Float32Array(frameLen);
      const speech = new Float32Array(frameLen);
      for (let i = 0; i < frameLen; i++) {
        speech[i] = 0.5 * Math.sin((2 * Math.PI * 440 * i) / sampleRate);
      }

      // 0.4s silence
      for (let f = 0; f < Math.round(0.4 / frameSec); f++) {
        const res = vad.processFrame(silence);
        if (res.shouldStop) throw new Error("VAD stopped prematurely during noise calibration");
      }
      if (vad.speechDetected) throw new Error("VAD falsely detected speech during noise calibration");

      // 1.0s speech
      for (let f = 0; f < Math.round(1.0 / frameSec); f++) {
        vad.processFrame(speech);
      }
      if (!vad.speechDetected) throw new Error("VAD failed to detect speech after 1.0s of speech");

      // Post-speech silence
      let stopFrame = -1;
      let reason = null;
      for (let f = 0; f < 70; f++) {
        const res = vad.processFrame(silence);
        if (res.shouldStop) {
          stopFrame = f;
          reason = res.stopReason;
          break;
        }
      }

      if (reason !== "silence") throw new Error(`Expected stopReason 'silence', got '${reason}'`);
      const elapsedSilence = stopFrame * frameSec;
      if (Math.abs(elapsedSilence - SILENCE_DURATION_SEC) > frameSec) {
        throw new Error(`Stop fired at ${elapsedSilence.toFixed(2)}s silence instead of ${SILENCE_DURATION_SEC}s`);
      }

      renderResult("VAD (silence-speech-silence segmentation and 2.5s silence timeout)", true, `Calibrated in 0.4s, detected speech after 0.5s, and triggered stop exactly 2.5s after speech ended.`);
    } catch (err) {
      renderResult("VAD (silence-speech-silence segmentation and 2.5s silence timeout)", false, String(err));
    }

    // Test 4: The call room uploads a silent answer after 20 seconds.
    try {
      const sampleRate = 16000;
      const frameSec = 0.1;
      const silence = new Float32Array(Math.round(sampleRate * frameSec));
      const vad = new VadDetector(sampleRate, { noSpeechTimeout: 20 });
      let elapsed = 0;
      let reason = null;
      for (let frame = 0; frame < 250; frame++) {
        const result = vad.processFrame(silence);
        elapsed += frameSec;
        if (result.shouldStop) {
          reason = result.stopReason;
          break;
        }
      }
      if (reason !== "timeout") throw new Error(`Expected timeout, got ${reason}`);
      if (Math.abs(elapsed - 20) > frameSec) {
        throw new Error(`Silent answer stopped after ${elapsed.toFixed(1)} seconds`);
      }
      renderResult("VAD (silent-answer upload window)", true, "No speech stops at 20 seconds so the silent recording can be submitted.");
    } catch (err) {
      renderResult("VAD (silent-answer upload window)", false, String(err));
    }
  </script>
</body>
</html>
